[package]
name = "bcp-encoder"
version = "0.1.0"
edition = "2024"
description = "Encoder for the Bit Context Protocol binary format"
license = "MIT"
repository = "https://github.com/mega-blastoise/bit-context-protocol"
homepage = "https://bitcontextprotocol.com"
keywords = ["bcp", "context", "encoder", "binary"]
categories = ["encoding", "compression"]

[dependencies]
bcp-wire = { path = "../bcp-wire", version = "0.1.0" }
bcp-types = { path = "../bcp-types", version = "0.1.0" }
blake3 = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
bcp-decoder = { path = "../bcp-decoder", version = "0.1.0" }
